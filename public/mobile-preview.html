<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>孔泽轩作品集 · 手机版预览</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 28px;
        color: #2f2930;
        background:
          linear-gradient(rgba(93, 128, 155, .08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(93, 128, 155, .08) 1px, transparent 1px),
          #eee5d8;
        background-size: 48px 48px;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      .preview-shell {
        display: grid;
        gap: 12px;
        justify-items: center;
      }

      .preview-label {
        padding: 7px 13px;
        color: rgba(47, 41, 48, .66);
        background: rgba(255, 250, 242, .86);
        border: 1px solid rgba(47, 41, 48, .22);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .04em;
      }

      .phone-frame {
        width: 410px;
        padding: 10px;
        overflow: hidden;
        background: #2f2930;
        border: 1px solid rgba(47, 41, 48, .72);
        border-radius: 30px;
        box-shadow: 0 24px 70px rgba(47, 41, 48, .24);
      }

      iframe {
        display: block;
        width: 390px;
        height: 844px;
        background: #f8f4ec;
        border: 0;
        border-radius: 21px;
      }

      @media (max-width: 480px) {
        body {
          display: block;
          padding: 0;
          background: #f8f4ec;
        }

        .preview-shell,
        .phone-frame {
          display: block;
          width: 100%;
          padding: 0;
          background: transparent;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .preview-label { display: none; }

        iframe {
          width: 100%;
          height: 100dvh;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <div class="preview-label">手机版预览 · 390 × 844</div>
      <div class="phone-frame">
        <iframe src="/" title="孔泽轩游戏系统策划作品集手机版预览"></iframe>
      </div>
    </main>
  </body>
</html>
